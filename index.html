<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive 4-Bit Binary to Decimal Converter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .converter-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p.subtitle {
      font-size: 0.85rem;
      text-align: center;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .binary-container {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }
    .bit-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .place-value {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .bit-btn {
      width: 100%;
      height: 60px;
      font-size: 1.5rem;
      font-weight: bold;
      background-color: #334155;
      color: #cbd5e1;
      border: 2px solid #475569;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .bit-btn.active {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .math-breakdown {
      background-color: #0f172a;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.9rem;
      text-align: center;
      color: #94a3b8;
      margin-bottom: 24px;
      border: 1px solid #1e293b;
    }
    .math-breakdown span.highlight {
      color: #38bdf8;
    }
    .result-box {
      text-align: center;
      background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
      padding: 16px;
      border-radius: 8px;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);
    }
    .result-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #e0f2fe;
    }
    .result-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="converter-card">
    <h1>4-Bit Binary Converter</h1>
    <p class="subtitle">Click the bit buttons below to toggle between 0 and 1</p>

    <div class="binary-container">
      <div class="bit-column">
        <div class="place-value">2³ (8)</div>
        <button class="bit-btn" id="bit3" onclick="toggleBit(3)">0</button>
      </div>
      <div class="bit-column">
        <div class="place-value">2² (4)</div>
        <button class="bit-btn" id="bit2" onclick="toggleBit(2)">0</button>
      </div>
      <div class="bit-column">
        <div class="place-value">2¹ (2)</div>
        <button class="bit-btn" id="bit1" onclick="toggleBit(1)">0</button>
      </div>
      <div class="bit-column">
        <div class="place-value">2⁰ (1)</div>
        <button class="bit-btn" id="bit0" onclick="toggleBit(0)">0</button>
      </div>
    </div>

    <div class="math-breakdown" id="mathBreakdown">
      (0×8) + (0×4) + (0×2) + (0×1) = <span class="highlight">0</span>
    </div>

    <div class="result-box">
      <div class="result-label">Decimal Result</div>
      <div class="result-value" id="decimalResult">0</div>
    </div>
  </div>

  <script>
    const bits = [0, 0, 0, 0];

    function toggleBit(bitIndex) {
      bits[bitIndex] = bits[bitIndex] === 0 ? 1 : 0;
      
      const btn = document.getElementById(`bit${bitIndex}`);
      btn.textContent = bits[bitIndex];
      if (bits[bitIndex] === 1) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }

      calculateDecimal();
    }

    function calculateDecimal() {
      const val3 = bits[3] * 8;
      const val2 = bits[2] * 4;
      const val1 = bits[1] * 2;
      const val0 = bits[0] * 1;
      
      const total = val3 + val2 + val1 + val0;

      document.getElementById('mathBreakdown').innerHTML = 
        `(${bits[3]}×8) + (${bits[2]}×4) + (${bits[1]}×2) + (${bits[0]}×1) = <span class="highlight">${total}</span>`;
      
      document.getElementById('decimalResult').textContent = total;
    }
  </script>
</body>
</html>
